name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root
      MYSQL_DB: pet_connect
      SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config
      - run: pip install -r requirements.txt
      - run: python db_init.py --from-env
      - run: python tests/smoke_test.py
