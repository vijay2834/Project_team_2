{% extends "base.html" %}
{% block title %}Edit Pet - Admin{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<h1 class="mb-4">Edit Pet</h1>
<form method="POST" action="{{ url_for('admin.edit_pet', pet_id=pet.PetID) }}" class="card card-body">
    <div class="mb-3"><label class="form-label">Name</label>
        <input name="pet_name" class="form-control" required value="{{ pet.PetName }}"></div>
    <div class="mb-3"><label class="form-label">Breed</label>
        <select name="breed_id" class="form-select" required>
            <option value="">Choose a breed</option>
            {% for b in breeds %}<option value="{{ b.BreedID }}" {% if pet.BreedID == b.BreedID %}selected{% endif %}>{{ b.BreedName }}</option>{% endfor %}
        </select></div>
    <div class="row">
        <div class="col mb-3"><label class="form-label">Age (years)</label>
            <input name="age" type="number" min="0" class="form-control" required value="{{ pet.Age }}"></div>
        <div class="col mb-3"><label class="form-label">Price ($)</label>
            <input name="price" type="number" step="0.01" min="0" class="form-control" required value="{{ pet.Price }}"></div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('admin.pets') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
</div></div>
{% endblock %}
