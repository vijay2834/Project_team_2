{% extends "base.html" %}
{% block title %}Edit Product - Admin{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<h1 class="mb-4">Edit Product</h1>
<form method="POST" action="{{ url_for('admin.edit_product', product_id=product.ProductID) }}" class="card card-body">
    <div class="mb-3"><label class="form-label">Name</label>
        <input name="product_name" class="form-control" required value="{{ product.ProductName }}"></div>
    <div class="mb-3"><label class="form-label">Category</label>
        <select name="category_id" class="form-select" required>
            <option value="">Choose a category</option>
            {% for c in categories %}<option value="{{ c.CategoryID }}" {% if product.CategoryID == c.CategoryID %}selected{% endif %}>{{ c.CategoryName }}</option>{% endfor %}
        </select></div>
    <div class="mb-3"><label class="form-label">Description</label>
        <textarea name="description" rows="3" class="form-control">{{ product.Description }}</textarea></div>
    <div class="row">
        <div class="col mb-3"><label class="form-label">Price ($)</label>
            <input name="price" type="number" step="0.01" min="0" class="form-control" required value="{{ product.Price }}"></div>
        <div class="col mb-3"><label class="form-label">Stock</label>
            <input name="stock" type="number" min="0" class="form-control" required value="{{ product.Stock }}"></div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
</div></div>
{% endblock %}
